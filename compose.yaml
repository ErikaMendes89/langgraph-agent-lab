name: incident-lab
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: incident_lab
      POSTGRES_USER: incident_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    secrets:
      - admin_password
      - app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_admin -d incident_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  admin_password:
    file: ./.local/admin_password
  app_password:
    file: ./.local/app_password
